[project]
name = "dev-agents"
version = "0.1.0"
description = "Reusable, repository-aware workflows for development agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "pydantic>=2.7",
    "PyYAML>=6.0",
]

[project.scripts]
dev-agents = "dev_agents.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.5",
    "types-PyYAML>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["dev_agents"]
